# Immer hell im Bosch-Stil (Frontend-Kit blue-50) – unabhängig von der Hell/Dunkel-Einstellung des Systems.
# Ein zusätzlicher [theme.dark]-Abschnitt würde dem System folgen; Besucher könnten dann nicht umschalten.
[theme]
base = "light"
primaryColor = "#007BC0"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # kein „Deploy“-Knopf
